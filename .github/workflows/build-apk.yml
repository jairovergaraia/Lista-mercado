name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Buscar APK
        id: apk
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No se generó ningún APK"; exit 1; fi
          echo "ruta=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ steps.apk.outputs.ruta }}
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" "${{ steps.apk.outputs.ruta }}" --title "APK ${{ github.run_number }}" --notes "Compilado automáticamente desde el .zip"
